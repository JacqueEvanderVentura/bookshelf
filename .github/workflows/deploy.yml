name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          GITHUB_SHA: ${{ github.sha }}
          NEXT_PUBLIC_FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}

      - name: Verify service worker was stamped
        run: |
          test -f out/sw.js
          test -f out/build-id.txt
          BUILD_ID=$(tr -d '[:space:]' < out/build-id.txt)
          echo "PWA build id: $BUILD_ID"
          grep -q "const BUILD_ID = '${BUILD_ID}'" out/sw.js
          grep -q "const CACHE = 'bookshelf-${BUILD_ID}'" out/sw.js
          if grep -q '__BUILD_ID__' out/sw.js; then
            echo "ERROR: placeholder __BUILD_ID__ still present in out/sw.js"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
